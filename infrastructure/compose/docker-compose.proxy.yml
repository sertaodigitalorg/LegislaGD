name: legislagd

services:
  proxy:
    image: traefik:latest
    container_name: legislagd-traefik
    environment:
      DOCKER_API_VERSION: "1.54"
    command:
      - --api.dashboard=true
      - --api.insecure=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --log.level=INFO
    ports:
      - "${TRAEFIK_HTTP_PORT:-80}:80"
      - "${TRAEFIK_DASHBOARD_PORT:-8088}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      legislagd:
        aliases:
          - id.legislagd.localhost
    labels:
      traefik.enable: "true"
      traefik.http.routers.legislagd-proxy.rule: "Host(`proxy.legislagd.localhost`) || Host(`traefik.legislagd.localhost`) || Host(`legislagd.localhost`)"
      traefik.http.routers.legislagd-proxy.entrypoints: "web"
      traefik.http.routers.legislagd-proxy.service: "api@internal"

networks:
  legislagd:
    name: legislagd
