services:
  traefik:
    profiles:
      - standalone

  symfony-admin:
    environment:
      DATABASE_URL: postgresql://${SIGI_DB_USER:-sigi}:${SIGI_DB_PASSWORD:-sigi_dev_password}@legislagd-postgres:5432/${SIGI_DB_NAME:-sigi_sd}?serverVersion=16&charset=utf8
      SIGI_OIDC_ENABLED: ${SIGI_OIDC_ENABLED:-true}
      SIGI_OIDC_DISPLAY_NAME: ${SIGI_OIDC_DISPLAY_NAME:-LegislaGD}
      SIGI_OIDC_ISSUER: ${SIGI_OIDC_ISSUER:-http://id.legislagd.localhost/realms/legislagd}
      SIGI_OIDC_WELL_KNOWN_URL: ${SIGI_OIDC_WELL_KNOWN_URL:-http://id.legislagd.localhost/realms/legislagd/.well-known/openid-configuration}
      SIGI_OIDC_CLIENT_ID: ${SIGI_OIDC_CLIENT_ID:-sigi}
      SIGI_OIDC_CLIENT_SECRET: ${SIGI_OIDC_CLIENT_SECRET:-}
      SIGI_OIDC_SCOPES: ${SIGI_OIDC_SCOPES:-openid email profile}
    depends_on:
      - redis
    networks:
      - sigi-network
      - legislagd
    labels:
      - traefik.enable=true
      - traefik.docker.network=legislagd
      - traefik.http.routers.symfony-admin.rule=Host(`sigi.legislagd.localhost`)
      - traefik.http.routers.symfony-admin.entrypoints=web
      - traefik.http.services.symfony-admin.loadbalancer.server.port=80

  sigi-worker:
    environment:
      DATABASE_URL: postgresql://${SIGI_DB_USER:-sigi}:${SIGI_DB_PASSWORD:-sigi_dev_password}@legislagd-postgres:5432/${SIGI_DB_NAME:-sigi_sd}?serverVersion=16&charset=utf8
    depends_on:
      - redis
      - symfony-admin
    networks:
      - sigi-network
      - legislagd

  chatwoot:
    image: ${CHATWOOT_SD_IMAGE:-legislagd/chatwoot-sd:dev}
    build:
      context: ./apps/chatwoot-sd
      dockerfile: docker/Dockerfile
    environment:
      POSTGRES_HOST: legislagd-postgres
      POSTGRES_DATABASE: ${CHATWOOT_DB_NAME:-chatwoot_production}
      POSTGRES_USERNAME: ${CHATWOOT_DB_USER:-chatwoot}
      POSTGRES_PASSWORD: ${CHATWOOT_DB_PASSWORD:-chatwoot_dev_password}
      FRONTEND_URL: ${CHATWOOT_FRONTEND_URL:-http://chat.sigi.legislagd.localhost}
      DEFAULT_LOCALE: ${CHATWOOT_DEFAULT_LOCALE:-pt_BR}
      CHATWOOT_OIDC_ENABLED: ${CHATWOOT_OIDC_ENABLED:-true}
      CHATWOOT_OIDC_PROVIDER_NAME: ${CHATWOOT_OIDC_PROVIDER_NAME:-legislagd}
      CHATWOOT_OIDC_DISPLAY_NAME: ${CHATWOOT_OIDC_DISPLAY_NAME:-LegislaGD}
      CHATWOOT_OIDC_ISSUER: ${CHATWOOT_OIDC_ISSUER:-http://id.legislagd.localhost/realms/legislagd}
      CHATWOOT_OIDC_CLIENT_ID: ${CHATWOOT_OIDC_CLIENT_ID:-chatwoot}
      CHATWOOT_OIDC_CLIENT_SECRET: ${CHATWOOT_OIDC_CLIENT_SECRET:?CHATWOOT_OIDC_CLIENT_SECRET must be set}
      CHATWOOT_OIDC_SCOPES: ${CHATWOOT_OIDC_SCOPES:-openid email profile}
      CHATWOOT_OIDC_UI_LOCALES: ${CHATWOOT_OIDC_UI_LOCALES:-pt-BR}
      CHATWOOT_OIDC_ACCOUNT_ID: ${CHATWOOT_OIDC_ACCOUNT_ID:-}
    depends_on:
      - redis
    networks:
      - sigi-network
      - legislagd
    labels:
      - traefik.enable=true
      - traefik.docker.network=legislagd
      - traefik.http.routers.chatwoot.rule=Host(`chat.sigi.legislagd.localhost`)
      - traefik.http.routers.chatwoot.entrypoints=web
      - traefik.http.services.chatwoot.loadbalancer.server.port=3000

  chatwoot-worker:
    image: ${CHATWOOT_SD_IMAGE:-legislagd/chatwoot-sd:dev}
    build:
      context: ./apps/chatwoot-sd
      dockerfile: docker/Dockerfile
    environment:
      POSTGRES_HOST: legislagd-postgres
      POSTGRES_DATABASE: ${CHATWOOT_DB_NAME:-chatwoot_production}
      POSTGRES_USERNAME: ${CHATWOOT_DB_USER:-chatwoot}
      POSTGRES_PASSWORD: ${CHATWOOT_DB_PASSWORD:-chatwoot_dev_password}
      FRONTEND_URL: ${CHATWOOT_FRONTEND_URL:-http://chat.sigi.legislagd.localhost}
      DEFAULT_LOCALE: ${CHATWOOT_DEFAULT_LOCALE:-pt_BR}
      CHATWOOT_OIDC_ENABLED: ${CHATWOOT_OIDC_ENABLED:-true}
      CHATWOOT_OIDC_PROVIDER_NAME: ${CHATWOOT_OIDC_PROVIDER_NAME:-legislagd}
      CHATWOOT_OIDC_DISPLAY_NAME: ${CHATWOOT_OIDC_DISPLAY_NAME:-LegislaGD}
      CHATWOOT_OIDC_ISSUER: ${CHATWOOT_OIDC_ISSUER:-http://id.legislagd.localhost/realms/legislagd}
      CHATWOOT_OIDC_CLIENT_ID: ${CHATWOOT_OIDC_CLIENT_ID:-chatwoot}
      CHATWOOT_OIDC_CLIENT_SECRET: ${CHATWOOT_OIDC_CLIENT_SECRET:?CHATWOOT_OIDC_CLIENT_SECRET must be set}
      CHATWOOT_OIDC_SCOPES: ${CHATWOOT_OIDC_SCOPES:-openid email profile}
      CHATWOOT_OIDC_UI_LOCALES: ${CHATWOOT_OIDC_UI_LOCALES:-pt-BR}
      CHATWOOT_OIDC_ACCOUNT_ID: ${CHATWOOT_OIDC_ACCOUNT_ID:-}
    depends_on:
      - redis
      - chatwoot
    networks:
      - sigi-network
      - legislagd

  botpress:
    networks:
      - sigi-network
      - legislagd
    labels:
      - traefik.enable=true
      - traefik.docker.network=legislagd
      - traefik.http.routers.botpress.rule=Host(`bot.sigi.legislagd.localhost`)
      - traefik.http.routers.botpress.entrypoints=web
      - traefik.http.services.botpress.loadbalancer.server.port=3000

  ollama:
    networks:
      - sigi-network
      - legislagd
    labels:
      - traefik.enable=true
      - traefik.docker.network=legislagd
      - traefik.http.routers.ollama.rule=Host(`ia.sigi.legislagd.localhost`)
      - traefik.http.routers.ollama.entrypoints=web
      - traefik.http.services.ollama.loadbalancer.server.port=11434

  qdrant:
    networks:
      - sigi-network
      - legislagd
    labels:
      - traefik.enable=true
      - traefik.docker.network=legislagd
      - traefik.http.routers.qdrant.rule=Host(`qdrant.sigi.legislagd.localhost`)
      - traefik.http.routers.qdrant.entrypoints=web
      - traefik.http.services.qdrant.loadbalancer.server.port=6333

  portainer:
    networks:
      - sigi-network
      - legislagd
    labels:
      - traefik.enable=true
      - traefik.docker.network=legislagd
      - traefik.http.routers.portainer.rule=Host(`portainer.sigi.legislagd.localhost`)
      - traefik.http.routers.portainer.entrypoints=web
      - traefik.http.services.portainer.loadbalancer.server.port=9000

  pgadmin:
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@sigi.dev.br}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-sigi_pgadmin_dev}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    depends_on: []
    networks:
      - sigi-network
      - legislagd
    labels:
      - traefik.enable=true
      - traefik.docker.network=legislagd
      - traefik.http.routers.pgadmin.rule=Host(`pgadmin.sigi.legislagd.localhost`)
      - traefik.http.routers.pgadmin.entrypoints=web
      - traefik.http.services.pgadmin.loadbalancer.server.port=80

networks:
  legislagd:
    external: true
    name: legislagd
